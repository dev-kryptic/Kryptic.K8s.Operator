name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  e2e:
    name: Operator QA (section 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kryptic-e2e

      - name: Pre-pull consumer image
        run: |
          docker pull busybox:1.36
          kind load docker-image busybox:1.36 --name kryptic-e2e

      - name: Run cluster QA
        run: go test ./test/e2e -tags=e2e -count=1 -timeout 10m -v
