apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: krypticsecrets.kryptic.dev
spec:
  group: kryptic.dev
  scope: Namespaced
  names:
    kind: KrypticSecret
    listKind: KrypticSecretList
    plural: krypticsecrets
    singular: krypticsecret
    shortNames: [ksec]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Project
          type: string
          jsonPath: .spec.projectId
        - name: Environment
          type: string
          jsonPath: .spec.environment
        - name: Secret
          type: string
          jsonPath: .spec.secretName
        - name: Keys
          type: integer
          jsonPath: .status.syncedKeyCount
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectId, environment]
              properties:
                projectId:
                  type: string
                  description: Project public id from kryptic.json (proj_…).
                  pattern: '^proj_[a-f0-9]{12}$'
                environment:
                  type: string
                  description: Environment slug (development, staging, production, …).
                  minLength: 1
                secretName:
                  type: string
                  description: Target Kubernetes Secret. Defaults to the KrypticSecret's name.
                refreshInterval:
                  type: string
                  description: Go duration between syncs. Defaults to 5m; values below 30s are ignored.
                  pattern: '^([0-9]+(s|m|h))+$'
                keys:
                  type: array
                  description: Restrict which secret keys are synced. Empty means all.
                  items:
                    type: string
                auth:
                  type: object
                  description: >-
                    Per-namespace machine identity. Recommended for production.
                    Omit only when the operator has cluster credentials
                    (KRYPTIC_CLIENT_ID and KRYPTIC_CLIENT_SECRET).
                  required: [secretRef]
                  properties:
                    secretRef:
                      type: object
                      required: [name]
                      description: >-
                        Secret in the same namespace with keys clientId and clientSecret
                        (a Kryptic machine identity), plus optional apiUrl for self-hosted
                        Pipelines BFF deployments. When this name is set it always
                        wins over cluster credentials.
                      properties:
                        name:
                          type: string
                          minLength: 1
                template:
                  type: object
                  properties:
                    type:
                      type: string
                      description: Type of the produced Secret. Defaults to Opaque.
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                syncedKeyCount:
                  type: integer
                lastSyncTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
