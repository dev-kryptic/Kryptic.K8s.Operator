# A complete working example: machine identity credentials + one KrypticSecret.
# Per-namespace credentials (below) are the recommended production path.
# For a non-production cluster identity, see README "Optional cluster machine identity".
#
# Create the machine identity in the Kryptic dashboard
# (Machine identities -> New identity), then:
#
#   kubectl create secret generic kryptic-machine-credentials \
#     --from-literal=clientId=kmi_xxxxxxxxxxxxxxxx \
#     --from-literal=clientSecret=<the one-time secret>
#
# For a self-hosted platform add --from-literal=apiUrl=https://pipelines.kryptic.example.com
apiVersion: v1
kind: Secret
metadata:
  name: kryptic-machine-credentials
  namespace: default
type: Opaque
stringData:
  clientId: kmi_replace_me
  clientSecret: replace_me
  # apiUrl: https://pipelines.kryptic.example.com
---
apiVersion: kryptic.dev/v1
kind: KrypticSecret
metadata:
  name: backend-secrets
  namespace: default
spec:
  projectId: proj_a1b2c3d4e5f6
  environment: production
  secretName: backend-env
  refreshInterval: 5m
  auth:
    secretRef:
      name: kryptic-machine-credentials
  template:
    type: Opaque
    labels:
      app.kubernetes.io/part-of: backend
---
# Consume it like any other Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: your-registry/backend:latest
          envFrom:
            - secretRef:
                name: backend-env
