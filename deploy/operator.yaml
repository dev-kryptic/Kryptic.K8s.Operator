apiVersion: v1
kind: Namespace
metadata:
  name: kryptic-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kryptic-operator
  namespace: kryptic-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kryptic-operator
rules:
  # The custom resource it reconciles.
  - apiGroups: ["kryptic.dev"]
    resources: ["krypticsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kryptic.dev"]
    resources: ["krypticsecrets/status"]
    verbs: ["get", "update", "patch"]
  # The Secrets it produces, and the credential Secrets it reads.
  # Deliberately no "delete": cleanup happens via owner references. Also no
  # "list"/"watch" (a compromised operator could otherwise enumerate every
  # Secret in the cluster) and no "patch": the controller only ever uses
  # get, create and update on named Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kryptic-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kryptic-operator
subjects:
  - kind: ServiceAccount
    name: kryptic-operator
    namespace: kryptic-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kryptic-operator
  namespace: kryptic-system
  labels:
    app.kubernetes.io/name: kryptic-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kryptic-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kryptic-operator
    spec:
      serviceAccountName: kryptic-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/dev-kryptic/kryptic-operator:1.1.0
          args: ["-log-level=info"]
          env:
            # Empty watches every namespace; set to scope the operator.
            - name: WATCH_NAMESPACE
              value: ""
            # Optional cluster machine identity. Non-production convenience:
            # one Secret in kryptic-system, then KrypticSecrets may omit
            # spec.auth. Per-namespace spec.auth.secretRef is the recommended
            # production path and always wins when set.
            #
            # Cluster credentials are opt-in per namespace. A KrypticSecret
            # without spec.auth may use them only when its namespace is listed
            # in KRYPTIC_CLUSTER_NAMESPACES (comma-separated; "*" is an
            # explicit allow-all; empty or unset allows none). Without this
            # gate, anyone who can create a KrypticSecret in any namespace
            # could sync every project this identity decrypts into a Secret
            # they control.
            # - name: KRYPTIC_CLUSTER_NAMESPACES
            #   value: "dev,staging"
            #
            # apiUrl values in credential Secrets must be https and their
            # host[:port] must appear in this allowlist (empty means only the
            # hosted default is accepted). This stops a Secret writer from
            # pointing the operator's machine credentials at an arbitrary
            # in-cluster or internal server (SSRF).
            # - name: KRYPTIC_API_URL_ALLOWLIST
            #   value: "pipelines.kryptic.example.com"
            # Dev only: allow http:// apiUrl values.
            # - name: KRYPTIC_ALLOW_INSECURE_API_URL
            #   value: "true"
            #
            # Create the Secret, then uncomment:
            #   kubectl create secret generic kryptic-machine-credentials \
            #     --namespace kryptic-system \
            #     --from-literal=clientId=kmi_xxxxxxxxxxxxxxxx \
            #     --from-literal=clientSecret=<the one-time secret>
            # - name: KRYPTIC_CLIENT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: kryptic-machine-credentials
            #       key: clientId
            # - name: KRYPTIC_CLIENT_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: kryptic-machine-credentials
            #       key: clientSecret
            # - name: KRYPTIC_API_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: kryptic-machine-credentials
            #       key: apiUrl
            #       optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
